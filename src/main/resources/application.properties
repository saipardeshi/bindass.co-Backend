# ─────────────────────────────────────────────────────────────
# BINDASS backend configuration — contains NO secrets.
# Real values come from (highest priority first):
#   1. environment variables  (SPRING_DATA_MONGODB_URI, APP_JWT_SECRET, RAZORPAY_KEY_SECRET, ...)
#   2. a local ./.env file    (git-ignored; copy .env.example → .env)
# ─────────────────────────────────────────────────────────────
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:5000}
app.client-url=${CLIENT_URL:http://localhost:5173}

# Database (set in .env / environment; default is a local MongoDB)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bindass}

# JWT — the app REFUSES TO START if the secret is missing, shorter than 32 chars or a placeholder.
# Generate one with:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Razorpay / Cloudinary / mail — leave empty to disable the feature
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.from=${MAIL_FROM:}

# Disable Spring Boot's mail autoconfiguration when credentials are not set
# (prevents a startup crash when username/password are blank). Remove this line when mail is configured.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Only trust X-Forwarded-For for rate limiting when running behind YOUR reverse proxy
app.rate-limit.trust-proxy=${TRUST_PROXY:false}

# Opt-in startup data
app.seed.enabled=${SEED_ENABLED:false}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Hardening
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
server.error.include-message=never
server.error.include-stacktrace=never
