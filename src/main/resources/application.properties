# ?? Server ????????????????????????????????????????????????????
server.port=8080
spring.application.name=bindass-backend

# ?? MongoDB Atlas ?????????????????????????????????????????????
# Replace <user>, <password>, <cluster> with your Atlas values
spring.data.mongodb.uri=mongodb+srv://<user>:<password>@<cluster>.mongodb.net/bindass?retryWrites=true&w=majority
spring.data.mongodb.database=bindass

# ?? JWT ???????????????????????????????????????????????????????
# Use a long random string (min 32 chars) for secret
app.jwt.secret=bindass_super_secret_jwt_key_replace_this_in_production_min_32chars
app.jwt.expiration=604800000
# 604800000 ms = 7 days

# ?? Cloudinary ????????????????????????????????????????????????
cloudinary.cloud-name=your_cloud_name
cloudinary.api-key=your_api_key
cloudinary.api-secret=your_api_secret

# ?? Razorpay ??????????????????????????????????????????????????
razorpay.key-id=rzp_test_xxxxxxxxxxxx
razorpay.key-secret=your_razorpay_secret

# ?? Email (Gmail SMTP) ????????????????????????????????????????
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.from=BINDASS <noreply@bindass.co>

# ?? Frontend URL (for CORS) ???????????????????????????????????
app.client-url=http://localhost:5173

# ?? File Upload limit ?????????????????????????????????????????
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# ?? Logging ???????????????????????????????????????????????????
logging.level.com.bindass=DEBUG
logging.level.org.springframework.security=WARN